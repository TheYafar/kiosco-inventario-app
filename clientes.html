<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kiosco App - Directorio de Clientes</title>
  <meta name="description" content="Gestión Mobile-First en Modo Nocturno de clientes habituales del kiosco.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/output.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased selection:bg-emerald-500 selection:text-white">

  <!-- Header Superior Limpio (Modo Nocturno) -->
  <header class="bg-slate-900 border-b border-slate-800 px-4 py-3 shadow-xs">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="inventario.html" class="w-10 h-10 rounded-2xl bg-emerald-600 flex items-center justify-center font-black text-xl text-white shadow-md shadow-emerald-600/30">
          👥
        </a>
        <div>
          <h1 class="font-black text-lg text-white leading-tight">Clientes</h1>
          <p class="text-xs font-semibold text-emerald-400">Directorio & Contactos</p>
        </div>
      </div>

      <button onclick="openClienteModal()" class="h-10 px-3.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-bold text-xs shadow-xs transition flex items-center gap-1">
        <span>➕</span> <span class="hidden sm:inline">Nuevo Cliente</span>
      </button>
    </div>
  </header>

  <!-- Sticky Header Search Nocturno -->
  <div class="sticky-header-search">
    <div class="max-w-7xl mx-auto">
      <div class="relative w-full">
        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400 text-lg">🔍</span>
        <input 
          type="text" 
          id="search-cliente" 
          placeholder="Buscar por nombre o teléfono de cliente..." 
          class="w-full h-12 pl-11 pr-4 rounded-xl border border-slate-800 bg-slate-900/90 text-white text-base font-medium placeholder-slate-500 shadow-xs focus:ring-2 focus:ring-emerald-500 focus:outline-none transition" 
        />
      </div>
    </div>
  </div>

  <!-- Contenido Principal -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-4 space-y-3">
    
    <!-- Lista de Clientes en Tarjetas Apiladas Nocturnas -->
    <div id="clientes-cards-container" class="space-y-3">
      <!-- Carga dinámica por clientes.js -->
    </div>

  </main>

  <!-- MODAL: REGISTRAR NUEVO CLIENTE (MODO NOCTURNO) -->
  <div id="cliente-modal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden items-center justify-center p-4">
    <div class="card-warm w-full max-w-md rounded-3xl p-5 sm:p-6 shadow-2xl modal-fadeIn border border-slate-800">
      
      <div class="flex items-center justify-between border-b border-slate-800 pb-3 mb-4">
        <h3 class="text-xl font-black text-white flex items-center gap-2">
          👤 Nuevo Cliente
        </h3>
        <button onclick="closeClienteModal()" class="w-10 h-10 rounded-xl bg-slate-800 text-slate-400 hover:text-white font-bold text-lg flex items-center justify-center">✕</button>
      </div>

      <form id="cliente-form" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1">Nombre Completo *</label>
          <input type="text" id="cliente-nombre" required placeholder="Ej. Carlos Gómez" class="w-full h-12 px-4 rounded-xl border border-slate-700 bg-slate-900 text-white text-sm font-medium focus:ring-2 focus:ring-emerald-500 focus:outline-none" />
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1">Teléfono *</label>
          <input type="text" id="cliente-telefono" required placeholder="Ej. 11-4567-8901" class="w-full h-12 px-4 rounded-xl border border-slate-700 bg-slate-900 text-white text-sm font-mono focus:ring-2 focus:ring-emerald-500 focus:outline-none" />
        </div>

        <div class="flex items-center justify-end gap-3 border-t border-slate-800 pt-4 mt-4">
          <button type="button" onclick="closeClienteModal()" class="h-12 px-5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-sm transition">
            Cancelar
          </button>
          <button type="submit" class="h-12 px-6 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-black text-sm shadow-md transition">
            Registrar Cliente
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- NAVEGACIÓN INFERIOR FIJA (4 PESTAÑAS) -->
  <nav class="bottom-nav-fixed">
    <a href="inventario.html" class="bottom-nav-item">
      <div class="nav-icon-wrapper">📦</div>
      <span>Inventario</span>
    </a>
    <a href="fiados.html" class="bottom-nav-item">
      <div class="nav-icon-wrapper">💳</div>
      <span>Fiados</span>
    </a>
    <a href="devoluciones.html" class="bottom-nav-item">
      <div class="nav-icon-wrapper">🔄</div>
      <span>Devoluciones</span>
    </a>
    <a href="alertas.html" class="bottom-nav-item">
      <div class="nav-icon-wrapper relative">
        🚨
        <span id="nav-alert-count" class="hidden absolute -top-1 -right-1.5 w-4 h-4 rounded-full bg-rose-600 text-white text-[10px] font-black flex items-center justify-center animate-pulse">0</span>
      </div>
      <span>Alertas</span>
    </a>
  </nav>

  <script src="js/api.js"></script>
  <script src="js/clientes.js"></script>
</body>
</html>
