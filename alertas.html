<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kiosco App - Alertas de Reposición Urgente</title>
  <meta name="description" content="Lista Mobile-First en Modo Nocturno de reposición urgente para productos con stock por debajo del stock mínimo configurado.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/output.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased selection:bg-emerald-500 selection:text-white">

  <!-- Header Superior Limpio (Modo Nocturno / No Print) -->
  <header class="bg-slate-900 border-b border-slate-800 px-4 py-3 shadow-xs no-print">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="inventario.html" class="w-10 h-10 rounded-2xl bg-amber-500 flex items-center justify-center font-black text-xl text-white shadow-md shadow-amber-500/30">
          🚨
        </a>
        <div>
          <h1 class="font-black text-lg text-white leading-tight">Alertas de Stock</h1>
          <p class="text-xs font-semibold text-amber-400">Reposición Urgente</p>
        </div>
      </div>

      <button id="print-alerts-btn" class="h-10 px-3.5 rounded-xl bg-slate-800 hover:bg-slate-700 active:scale-95 text-white font-bold text-xs shadow-xs transition flex items-center gap-1.5 border border-slate-700">
        <span>🖨️</span> <span class="hidden sm:inline">Imprimir Orden</span>
      </button>
    </div>
  </header>

  <!-- Contenido Principal -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-4 space-y-4">
    
    <!-- Encabezado impreso exclusivo para compras -->
    <div class="hidden print-only mb-6 text-center border-b pb-4">
      <h1 class="text-2xl font-bold text-slate-900">ORDEN DE REPOSICIÓN Y COMPRA A PROVEEDORES</h1>
      <p class="text-sm text-slate-600">Fecha de emisión: <span id="print-date"></span> - Kiosco App</p>
    </div>

    <!-- Indicadores Métricos Nocturnos -->
    <div class="grid grid-cols-2 gap-3 no-print">
      <div class="card-warm p-4 border-l-4 border-l-amber-500">
        <p class="text-[11px] text-slate-400 font-bold uppercase">Bajo Stock (&le; Mínimo)</p>
        <p id="alert-total-count" class="text-2xl sm:text-3xl font-black text-amber-400 mt-0.5">0</p>
      </div>

      <div class="card-warm p-4 border-l-4 border-l-rose-500">
        <p class="text-[11px] text-slate-400 font-bold uppercase">Totalmente Agotados (0)</p>
        <p id="alert-urgent-count" class="text-2xl sm:text-3xl font-black text-rose-400 mt-0.5">0</p>
      </div>
    </div>

    <!-- Contenedor de Alertas de Productos (Mobile-First Cards Nocturnas) -->
    <div id="alerts-list-container" class="space-y-3">
      <!-- Carga dinámica por alertas.js -->
    </div>

  </main>

  <!-- NAVEGACIÓN INFERIOR FIJA (4 PESTAÑAS: INVENTARIO, FIADOS, DEVOLUCIONES, ALERTAS) -->
  <nav class="bottom-nav-fixed no-print">
    <a href="inventario.html" class="bottom-nav-item">
      <div class="nav-icon-wrapper">📦</div>
      <span>Inventario</span>
    </a>
    <a href="fiados.html" class="bottom-nav-item">
      <div class="nav-icon-wrapper">💳</div>
      <span>Fiados</span>
    </a>
    <a href="devoluciones.html" class="bottom-nav-item">
      <div class="nav-icon-wrapper">🔄</div>
      <span>Devoluciones</span>
    </a>
    <a href="alertas.html" class="bottom-nav-item active">
      <div class="nav-icon-wrapper relative">
        🚨
        <span id="nav-alert-count" class="hidden absolute -top-1 -right-1.5 w-4 h-4 rounded-full bg-rose-600 text-white text-[10px] font-black flex items-center justify-center animate-pulse">0</span>
      </div>
      <span>Alertas</span>
    </a>
  </nav>

  <script src="js/api.js"></script>
  <script src="js/alertas.js"></script>
  <script>
    document.getElementById('print-date').textContent = new Date().toLocaleDateString('es-AR', {
      year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit'
    });
  </script>
</body>
</html>
