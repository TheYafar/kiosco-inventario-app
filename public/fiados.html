<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kiosco App - Cuentas por Cobrar (Fiados)</title>
  <meta name="description" content="Gestión Mobile-First en Modo Nocturno de ventas fiadas, cuotas, abonos parciales y recargos por mora.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/output.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased selection:bg-emerald-500 selection:text-white">

  <!-- Header Superior Limpio (Modo Nocturno) -->
  <header class="bg-slate-900 border-b border-slate-800 px-4 py-3 shadow-xs">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="inventario.html" class="w-10 h-10 rounded-2xl bg-amber-500 flex items-center justify-center font-black text-xl text-white shadow-md shadow-amber-500/30">
          💳
        </a>
        <div>
          <h1 class="font-black text-lg text-white leading-tight">Cuentas Fiadas</h1>
          <p class="text-xs font-semibold text-amber-400">Fiados & Abonos</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="openClienteModal()" class="h-10 px-3 rounded-xl bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-200 font-bold text-xs shadow-xs transition flex items-center gap-1 border border-slate-700">
          <span>👤</span> <span class="hidden sm:inline">Nuevo Cliente</span>
        </button>
        <button onclick="openFiadoModal()" class="h-10 px-3.5 rounded-xl bg-amber-600 hover:bg-amber-500 active:scale-95 text-white font-bold text-xs shadow-xs transition flex items-center gap-1">
          <span>➕</span> <span class="hidden sm:inline">Nueva Deuda</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Sticky Header Search & Filter Slider -->
  <div class="sticky-header-search">
    <div class="max-w-7xl mx-auto space-y-2.5">
      
      <!-- Campo de Búsqueda Rápida de Cliente -->
      <div class="relative w-full">
        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400 text-lg">🔍</span>
        <input 
          type="text" 
          id="search-fiado-input" 
          placeholder="Buscar por cliente o teléfono..." 
          class="w-full h-12 pl-11 pr-4 rounded-xl border border-slate-800 bg-slate-900/90 text-white text-base font-medium placeholder-slate-500 shadow-xs focus:ring-2 focus:ring-amber-500 focus:outline-none transition" 
        />
      </div>

      <!-- Filtros de Estado & Acciones -->
      <div class="flex flex-wrap items-center justify-between gap-2">
        <div id="fiados-status-pills" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5 text-xs">
          <button class="fiado-pill active h-10 px-3.5 rounded-xl font-bold bg-amber-500 text-white shrink-0 shadow-xs transition" data-estado="TODOS">
            ✨ Todos
          </button>
          <button class="fiado-pill h-10 px-3.5 rounded-xl font-bold bg-slate-900 text-slate-300 border border-slate-800 hover:bg-slate-800 shrink-0 shadow-xs transition" data-estado="PENDIENTE">
            ⌛ Pendientes
          </button>
          <button class="fiado-pill h-10 px-3.5 rounded-xl font-bold bg-slate-900 text-slate-300 border border-slate-800 hover:bg-slate-800 shrink-0 shadow-xs transition" data-estado="VENCIDO">
            🚨 Vencidos (+5%)
          </button>
          <button class="fiado-pill h-10 px-3.5 rounded-xl font-bold bg-slate-900 text-slate-300 border border-slate-800 hover:bg-slate-800 shrink-0 shadow-xs transition" data-estado="PAGADO">
            ✓ Pagados
          </button>
        </div>

        <button onclick="procesarMoraManual()" class="h-10 px-3 rounded-xl bg-rose-950/60 hover:bg-rose-900/80 text-rose-300 border border-rose-800/60 font-bold text-xs transition flex items-center gap-1 shrink-0">
          <span>⚡</span> Evaluar Mora (+5%)
        </button>
      </div>

    </div>
  </div>

  <!-- Contenido Principal -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-4 space-y-4">
    
    <!-- Tarjetas Métricas Resumen Nocturnas -->
    <div class="grid grid-cols-2 gap-3">
      <div class="card-warm p-4 border-l-4 border-l-amber-500">
        <p class="text-[11px] text-slate-400 font-bold uppercase">Total Pendiente</p>
        <p id="summary-total-fiado" class="text-2xl sm:text-3xl font-black text-amber-400 mt-0.5">$0.00</p>
      </div>

      <div class="card-warm p-4 border-l-4 border-l-rose-500">
        <p class="text-[11px] text-slate-400 font-bold uppercase">Cuentas con Mora (+5%)</p>
        <p id="summary-vencidos-count" class="text-2xl sm:text-3xl font-black text-rose-400 mt-0.5">0</p>
      </div>
    </div>

    <!-- Lista de Tarjetas de Fiados -->
    <div id="fiados-list-container" class="space-y-3">
      <!-- Carga dinámica por fiados.js -->
    </div>

  </main>

  <!-- MODAL: REGISTRAR NUEVA DEUDA FIADA (MODO NOCTURNO) -->
  <div id="fiado-modal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden items-center justify-center p-4">
    <div class="card-warm w-full max-w-lg rounded-3xl p-5 sm:p-6 shadow-2xl modal-fadeIn border border-slate-800">
      
      <div class="flex items-center justify-between border-b border-slate-800 pb-3 mb-4">
        <h3 class="text-xl font-black text-white flex items-center gap-2">
          💳 Nueva Deuda Fiada
        </h3>
        <button onclick="closeFiadoModal()" class="w-10 h-10 rounded-xl bg-slate-800 text-slate-400 hover:text-white font-bold text-lg flex items-center justify-center">✕</button>
      </div>

      <form id="fiado-form" class="space-y-4">
        <div>
          <div class="flex items-center justify-between mb-1">
            <label class="block text-xs font-bold text-slate-300">Cliente *</label>
            <button type="button" onclick="openClienteModal()" class="text-xs font-bold text-amber-400 hover:underline flex items-center gap-1">
              ➕ Crear Cliente Nuevo
            </button>
          </div>
          <div class="flex items-center gap-2">
            <select id="fiado-cliente" required class="flex-1 h-12 px-4 rounded-xl border border-slate-700 bg-slate-900 text-slate-200 text-sm font-semibold focus:ring-2 focus:ring-amber-500 focus:outline-none">
              <option value="">Selecciona un Cliente *</option>
            </select>
            <button type="button" onclick="openClienteModal()" class="h-12 px-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-amber-400 font-bold text-xs border border-slate-700 shrink-0" title="Registrar nuevo cliente rápido">
              + Nuevo
            </button>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-300 mb-1">Monto Fiado ($) *</label>
            <input type="number" step="0.01" id="fiado-monto" required min="1" placeholder="Ej. 2500.00" class="w-full h-12 px-4 rounded-xl border border-slate-700 bg-slate-900 text-amber-400 font-extrabold text-base focus:ring-2 focus:ring-amber-500 focus:outline-none" />
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-300 mb-1">Plazo Vencimiento (Días)</label>
            <input type="number" id="fiado-dias" min="1" value="7" class="w-full h-12 px-4 rounded-xl border border-slate-700 bg-slate-900 text-white text-sm font-bold focus:ring-2 focus:ring-amber-500 focus:outline-none" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1">Detalle / Notas de Productos</label>
          <input type="text" id="fiado-notas" placeholder="Ej. 2x Coca Cola 500ml y Papas Lays" class="w-full h-12 px-4 rounded-xl border border-slate-700 bg-slate-900 text-white text-sm font-medium focus:ring-2 focus:ring-amber-500 focus:outline-none" />
        </div>

        <div class="flex items-center justify-end gap-3 border-t border-slate-800 pt-4 mt-4">
          <button type="button" onclick="closeFiadoModal()" class="h-12 px-5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-sm transition">
            Cancelar
          </button>
          <button type="submit" class="h-12 px-6 rounded-xl bg-amber-600 hover:bg-amber-500 text-white font-black text-sm shadow-md transition">
            Registrar Deuda
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: REGISTRAR CLIENTE DESDE FIADOS -->
  <div id="cliente-modal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden items-center justify-center p-4">
    <div class="card-warm w-full max-w-md rounded-3xl p-5 sm:p-6 shadow-2xl modal-fadeIn border border-slate-800">
      
      <div class="flex items-center justify-between border-b border-slate-800 pb-3 mb-4">
        <h3 class="text-xl font-black text-white flex items-center gap-2">
          👤 Nuevo Cliente
        </h3>
        <button onclick="closeClienteModal()" class="w-10 h-10 rounded-xl bg-slate-800 text-slate-400 hover:text-white font-bold text-lg flex items-center justify-center">✕</button>
      </div>

      <form id="cliente-form" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1">Nombre Completo *</label>
          <input type="text" id="cliente-nombre" required placeholder="Ej. Carlos Gómez" class="w-full h-12 px-4 rounded-xl border border-slate-700 bg-slate-900 text-white text-sm font-medium focus:ring-2 focus:ring-emerald-500 focus:outline-none" />
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1">Teléfono *</label>
          <input type="text" id="cliente-telefono" required placeholder="Ej. 11-4567-8901" class="w-full h-12 px-4 rounded-xl border border-slate-700 bg-slate-900 text-white text-sm font-mono focus:ring-2 focus:ring-emerald-500 focus:outline-none" />
        </div>

        <div class="flex items-center justify-end gap-3 border-t border-slate-800 pt-4 mt-4">
          <button type="button" onclick="closeClienteModal()" class="h-12 px-5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-sm transition">
            Cancelar
          </button>
          <button type="submit" class="h-12 px-6 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-black text-sm shadow-md transition">
            Registrar Cliente
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: REGISTRAR ABONO (MODO NOCTURNO) -->
  <div id="abono-modal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden items-center justify-center p-4">
    <div class="card-warm w-full max-w-md rounded-3xl p-5 sm:p-6 shadow-2xl modal-fadeIn border border-slate-800">
      
      <div class="flex items-center justify-between border-b border-slate-800 pb-3 mb-4">
        <h3 class="text-xl font-black text-white flex items-center gap-2">
          💵 Registrar Abono de Pago
        </h3>
        <button onclick="closeAbonoModal()" class="w-10 h-10 rounded-xl bg-slate-800 text-slate-400 hover:text-white font-bold text-lg flex items-center justify-center">✕</button>
      </div>

      <form id="abono-form" class="space-y-4">
        <div class="bg-slate-900/60 p-4 rounded-2xl border border-slate-800 space-y-1">
          <p class="text-xs font-bold text-slate-400 uppercase">Cliente:</p>
          <p id="abono-cliente-name" class="font-black text-white text-base">--</p>
          <p class="text-xs font-bold text-slate-400 uppercase mt-2">Saldo Actual a Pagar:</p>
          <p id="abono-saldo-actual" class="font-black text-rose-400 text-xl">$0.00</p>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1">Monto a Ingresar / Abonar ($) *</label>
          <input type="number" step="0.01" id="abono-monto" required min="0.01" class="w-full h-14 px-4 rounded-xl border border-slate-700 bg-slate-900 text-emerald-400 font-black text-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none" />
        </div>

        <div class="flex items-center justify-end gap-3 border-t border-slate-800 pt-4">
          <button type="button" onclick="closeAbonoModal()" class="h-12 px-5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-sm transition">
            Cancelar
          </button>
          <button type="submit" class="h-12 px-6 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-black text-sm shadow-md transition">
            Confirmar Abono
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- NAVEGACIÓN INFERIOR FIJA (4 PESTAÑAS: INVENTARIO, FIADOS, DEVOLUCIONES, ALERTAS) -->
  <nav class="bottom-nav-fixed">
    <a href="inventario.html" class="bottom-nav-item">
      <div class="nav-icon-wrapper">📦</div>
      <span>Inventario</span>
    </a>
    <a href="fiados.html" class="bottom-nav-item active">
      <div class="nav-icon-wrapper">💳</div>
      <span>Fiados</span>
    </a>
    <a href="devoluciones.html" class="bottom-nav-item">
      <div class="nav-icon-wrapper">🔄</div>
      <span>Devoluciones</span>
    </a>
    <a href="alertas.html" class="bottom-nav-item">
      <div class="nav-icon-wrapper relative">
        🚨
        <span id="nav-alert-count" class="hidden absolute -top-1 -right-1.5 w-4 h-4 rounded-full bg-rose-600 text-white text-[10px] font-black flex items-center justify-center animate-pulse">0</span>
      </div>
      <span>Alertas</span>
    </a>
  </nav>

  <script src="js/api.js"></script>
  <script src="js/fiados.js"></script>
</body>
</html>
